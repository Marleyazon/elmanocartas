<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traducteur de poche</title>
<style>
  :root{
    --bg:#0f1620;
    --card:#ffffff;
    --ink:#26282b;
    --muted:#6b7280;
    --blue:#1f6fd6;
    --blue-dark:#1a5bb0;
    --green:#3fae4a;
    --green-dark:#2f8f39;
    --red:#e5533d;
    --red-dark:#c9432f;
    --gray:#e5e5e5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  .app{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    min-height:560px;
    display:flex;
    flex-direction:column;
  }
  #screenHome{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    gap:20px;
    text-align:center;
  }
  .card-icon{
    width:150px; height:150px;
    border-radius:20px;
    background:var(--blue);
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 0 var(--blue-dark);
    transition:transform .05s;
  }
  .card-icon:active{ transform:translateY(6px); box-shadow:0 4px 0 var(--blue-dark); }
  .card-icon svg{ width:76px; height:76px; }
  h1{ font-size:22px; margin:6px 0 0; }
  .home-hint{ color:var(--muted); font-size:14px; margin:0; }
  .editions{ display:none; flex-direction:column; gap:12px; width:100%; margin-top:6px; }
  .editions.show{ display:flex; }
  .edition-btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:16px;
    font-size:17px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    color:#fff;
    background:var(--blue);
    box-shadow:0 6px 0 var(--blue-dark);
  }
  .edition-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--blue-dark); }
  .edition-btn.disabled{
    background:var(--gray);
    color:var(--muted);
    box-shadow:0 6px 0 #cfcfcf;
    cursor:not-allowed;
  }
  .edition-btn small{ display:block; font-weight:400; font-size:12px; margin-top:3px; opacity:.85; }
  #screenQuiz{ display:none; flex:1; flex-direction:column; }
  #screenQuiz.show{ display:flex; }
  .quiz-top{ display:flex; align-items:center; gap:12px; padding:16px 18px; }
  .close-btn{ background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; line-height:1; padding:4px; }
  .bar-track{ flex:1; height:12px; background:var(--gray); border-radius:8px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--green); width:0%; transition:width .3s ease; border-radius:8px; }
  .score-pill{ font-size:13px; font-weight:700; color:var(--blue); min-width:52px; text-align:right; }
  .quiz-main{ flex:1; padding:8px 24px 20px; display:flex; flex-direction:column; }
  .instr{ color:var(--muted); font-size:14px; text-align:center; margin:14px 0 4px; }
  .prompt-word{ font-size:28px; font-weight:800; text-align:center; margin:10px 0 6px; }
  .listen-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:16px auto 22px;
    background:var(--card);
    border:2px solid var(--blue);
    color:var(--blue);
    border-radius:14px;
    padding:12px 20px;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }
  .listen-btn:active{ background:#eaf2fd; }
  #answerInput{
    width:100%;
    padding:15px 16px;
    border-radius:12px;
    border:2px solid var(--gray);
    font-size:17px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
  }
  #answerInput:focus{ outline:none; border-color:var(--blue); }
  .spacer{ flex:1; }
  .check-btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:16px;
    font-size:16px;
    font-weight:800;
    font-family:inherit;
    color:#fff;
    background:var(--green);
    box-shadow:0 6px 0 var(--green-dark);
    cursor:pointer;
    margin-top:16px;
  }
  .check-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--green-dark); }
  .check-btn:disabled{ background:var(--gray); color:var(--muted); box-shadow:0 6px 0 #cfcfcf; cursor:not-allowed; }
  .banner{
    display:none;
    padding:18px 22px 22px;
    flex-direction:column;
    gap:10px;
  }
  .banner.show{ display:flex; }
  .banner.correct{ background:#d7f7db; }
  .banner.wrong{ background:#ffe1dc; }
  .banner-title{ font-weight:800; font-size:17px; display:flex; align-items:center; gap:8px; }
  .banner.correct .banner-title{ color:var(--green-dark); }
  .banner.wrong .banner-title{ color:var(--red-dark); }
  .banner-detail{ font-size:14px; color:var(--ink); }
  .banner-continue{
    border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:800;
    font-family:inherit; color:#fff; cursor:pointer;
  }
  .banner.correct .banner-continue{ background:var(--green); box-shadow:0 6px 0 var(--green-dark); }
  .banner.wrong .banner-continue{ background:var(--red); box-shadow:0 6px 0 var(--red-dark); }
  .banner-continue:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.3); }
  .recap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; gap:8px; }
  .recap .big{ font-size:46px; font-weight:800; color:var(--blue); margin:6px 0; }
  .recap-btns{ display:flex; gap:10px; width:100%; margin-top:18px; }
  .recap-btns button{ flex:1; }
  .ghost-btn{
    background:#fff; border:2px solid var(--blue); color:var(--blue);
    border-radius:14px; padding:14px; font-size:15px; font-weight:800; font-family:inherit; cursor:pointer;
  }
</style>
</head>
<body>

<div class="app">

  <div id="screenHome">
    <button class="card-icon" id="cardBtn" type="button" aria-label="Ouvrir le traducteur">
      <svg viewBox="0 0 100 100" fill="none">
        <path d="M20 30h34v22H32l-8 9v-9h-4z" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
        <path d="M80 40H46v22h20l8 9v-9h6z" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.7"/>
        <path d="M26 38h20M26 45h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <path d="M52 47h20M52 54h13" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      </svg>
    </button>
    <h1>Traducteur de poche</h1>
    <p class="home-hint" id="homeHint">Appuie sur la carte pour commencer</p>
    <button id="diagBtn" type="button" style="background:none;border:none;color:#9aa3ad;font-size:12px;text-decoration:underline;cursor:pointer;">Tester le son</button>
    <p id="diagResult" style="font-size:12px;color:#9aa3ad;max-width:280px;"></p>

    <div class="editions" id="editions">
      <button class="edition-btn disabled" id="btn2025" type="button">
        Édition 2025
        <small>À venir</small>
      </button>
      <button class="edition-btn" id="btn2026" type="button">
        Édition 2026
        <small>Exercices d'écoute et d'écriture</small>
      </button>
    </div>
  </div>

  <div id="screenQuiz">
    <div class="quiz-top">
      <button class="close-btn" id="closeBtn" type="button">✕</button>
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      <div class="score-pill" id="scorePill">0/18</div>
    </div>
    <div class="quiz-main" id="quizMain"></div>
    <div class="banner" id="banner">
      <div class="banner-title" id="bannerTitle"></div>
      <div class="banner-detail" id="bannerDetail"></div>
      <button class="banner-continue" id="bannerContinue" type="button">Continuer</button>
    </div>
  </div>

</div>

<script>
(function(){

  const VOCAB = [
    { forms:[{c:"Aeroporche", p:"Aeroportche"}], fr:["Aéroport"] },
    { forms:[{c:"Dala", p:"Dal"}], fr:["Valise"] },
    { forms:[{c:"Avìon", p:"Abvion"}], fr:["Avion"] },
    { forms:[{c:"Carchaporche", p:"Carchaportche"}], fr:["Convoyeur"] },
    { forms:[{c:"Carchaporche del de dalas", p:"Carchaportche del de dalas"}], fr:["Convoyeur de valises"] },
    { forms:[{c:"Sole", p:"Sole"}], fr:["Soleil"] },
    { forms:[{c:"Lùna", p:"Luna"}], fr:["Lune"] },
    { forms:[{c:"Cìelo", p:"Ciel"}], fr:["Ciel"] },
    { forms:[{c:"Nùaje", p:"Nuaje"}], fr:["Nuage"] },
    { forms:[{c:"Plaja", p:"Plaja"}], fr:["Plage"] },
    { forms:[{c:"Eaù", p:"Eau"}, {c:"O", p:"o"}], fr:["Eau"] },
    { forms:[{c:"Gùrda", p:"Gurda"}], fr:["Gourde","Cruche","Bouteille"] },
    { forms:[{c:"Gùrdo", p:"Gurdo"}], fr:["Bouteille d'eau","Gourde d'eau"] },
    { forms:[{c:"Trùssa", p:"Trussa"}], fr:["Trousse"] },
    { forms:[{c:"Estámina", p:"Estamina"}, {c:"Estamana del mina de cránta", p:"Estamana del mina de cranta"}], fr:["Crayon de mine","Crayon","Crayon à papier","Crayon de papier","Crayon à mine"] },
    { forms:[{c:"Gomá", p:"Goma"}], fr:["Gomme"] },
    { forms:[{c:"Veli", p:"Bveli"}, {c:"Velecipertarador", p:"Bvelesipertarador"}], fr:["Colle"] },
    { forms:[{c:"Zelcedes", p:"Zelsedes"}], fr:["Ciseaux"] }
  ];

  function normalize(s){
    return s.toString()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase()
      .replace(/[’']/g,"'")
      .replace(/[^a-z0-9' ]/g,'')
      .replace(/\s+/g,' ')
      .trim();
  }
  function levenshtein(a,b){
    const m=a.length,n=b.length;
    const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
    for(let i=0;i<=m;i++) d[i][0]=i;
    for(let j=0;j<=n;j++) d[0][j]=j;
    for(let i=1;i<=m;i++){
      for(let j=1;j<=n;j++){
        const cost = a[i-1]===b[j-1] ? 0 : 1;
        d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
      }
    }
    return d[m][n];
  }
  function bestMatch(userRaw, candidatesRaw){
    const user = normalize(userRaw);
    let best = { dist: Infinity, candidate: candidatesRaw[0] };
    for(const cand of candidatesRaw){
      const dist = levenshtein(user, normalize(cand));
      if(dist < best.dist) best = { dist, candidate: cand };
    }
    return best;
  }

  let currentUtterance = null;
  function pickVoice(lang){
    const voices = window.speechSynthesis.getVoices();
    const prefix = lang.slice(0,2).toLowerCase();
    const matchLocal = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix) && v.localService);
    if(matchLocal) return matchLocal;
    const anyLocal = voices.find(v => v.localService);
    if(anyLocal) return anyLocal;
    const matchAny = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
    if(matchAny) return matchAny;
    return null;
  }
  function speak(text, lang){
    if(!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      setTimeout(function(){
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        const v = pickVoice(lang);
        if(v) u.voice = v;
        u.rate = 0.85;
        currentUtterance = u;
        window.speechSynthesis.speak(u);
      }, 80);
    }catch(e){}
  }
  if('speechSynthesis' in window){
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
  }

  const diagBtn = document.getElementById('diagBtn');
  const diagResult = document.getElementById('diagResult');
  diagBtn.addEventListener('click', function(){
    if(!('speechSynthesis' in window)){
      diagResult.textContent = "Ton navigateur ne supporte pas du tout la synthèse vocale.";
      return;
    }
    const voices = window.speechSynthesis.getVoices();
    if(voices.length === 0){
      diagResult.textContent = "0 voix trouvée. Nouvel essai...";
      setTimeout(function(){
        const v2 = window.speechSynthesis.getVoices();
        diagResult.textContent = v2.length + " voix trouvée(s) après réessai. " + (v2.length === 0 ? "Aucune voix installée." : "Clique encore.");
      }, 1000);
      return;
    }
    const esCount = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('es')).length;
    const chosen = pickVoice('es-ES');
    diagResult.textContent = voices.length + " voix, dont " + esCount + " en espagnol" + (esCount === 0 ? " (AUCUNE voix espagnole installée sur ce PC)" : "") + ". Voix choisie : " + (chosen ? chosen.name + (chosen.localService ? " (locale)" : " (en ligne)") : "aucune (défaut du système)") + ". Test...";
    window.speechSynthesis.cancel();
    window.speechSynthesis.resume();
    setTimeout(function(){
      const u = new SpeechSynthesisUtterance("Hola, esto es una prueba");
      if(chosen) u.voice = chosen;
      u.lang = 'es-ES';
      u.onstart = function(){ diagResult.textContent += " → lecture démarrée."; };
      u.onerror = function(e){ diagResult.textContent += " → erreur : " + e.error; };
      u.onend = function(){ diagResult.textContent += " → terminé."; };
      currentUtterance = u;
      window.speechSynthesis.speak(u);
    }, 80);
  });

  const screenHome = document.getElementById('screenHome');
  const screenQuiz = document.getElementById('screenQuiz');
  const cardBtn = document.getElementById('cardBtn');
  const editions = document.getElementById('editions');
  const homeHint = document.getElementById('homeHint');
  const btn2025 = document.getElementById('btn2025');
  const btn2026 = document.getElementById('btn2026');
  const closeBtn = document.getElementById('closeBtn');

  cardBtn.addEventListener('click', function(){
    editions.classList.toggle('show');
    homeHint.style.display = editions.classList.contains('show') ? 'none' : '';
  });
  btn2025.addEventListener('click', function(){ });
  btn2026.addEventListener('click', startSession);
  closeBtn.addEventListener('click', endSession);

  let session = [];
  let idx = 0;
  let score = 0;
  let currentAccepted = [];
  let answered = false;

  function shuffledSession(){
    const rounds = VOCAB.map(entry => ({
      entry,
      dir: Math.random() < 0.5 ? 'c2f' : 'f2c'
    }));
    for(let i=rounds.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [rounds[i],rounds[j]]=[rounds[j],rounds[i]];
    }
    return rounds;
  }

  function startSession(){
    session = shuffledSession();
    idx = 0;
    score = 0;
    screenHome.style.display = 'none';
    screenQuiz.classList.add('show');
    document.getElementById('banner').classList.remove('show','correct','wrong');
    renderRound();
  }

  function endSession(){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    screenQuiz.classList.remove('show');
    screenHome.style.display = '';
    editions.classList.remove('show');
    homeHint.style.display = '';
  }

  function updateHeader(){
    document.getElementById('scorePill').textContent = score + '/' + session.length;
    document.getElementById('barFill').style.width = (idx/session.length*100) + '%';
  }

  function renderRound(){
    answered = false;
    const banner = document.getElementById('banner');
    banner.classList.remove('show','correct','wrong');

    if(idx >= session.length){
      renderRecap();
      return;
    }
    updateHeader();
    const round = session[idx];
    const main = document.getElementById('quizMain');

    if(round.dir === 'c2f'){
      const form = round.entry.forms[Math.floor(Math.random()*round.entry.forms.length)];
      currentAccepted = round.entry.fr;
      main.innerHTML = `
        <p class="instr">Écoute le mot et écris sa traduction en français</p>
        <button class="listen-btn" id="listenBtn" type="button">🔊 Écouter</button>
        <input type="text" id="answerInput" placeholder="Traduction en français" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="spacer"></div>
        <button class="check-btn" id="checkBtn" type="button">Vérifier</button>
      `;
      document.getElementById('listenBtn').addEventListener('click', () => speak(form.p, 'es-ES'));
      speak(form.p, 'es-ES');
    } else {
      const frWord = round.entry.fr[Math.floor(Math.random()*round.entry.fr.length)];
      currentAccepted = round.entry.forms.map(f => f.c);
      main.innerHTML = `
        <p class="instr">Écris ce mot dans ta langue</p>
        <p class="prompt-word">${frWord}</p>
        <div class="audio-row" style="display:flex;justify-content:center;">
          <button class="listen-btn" id="listenBtn" type="button">🔊 Réécouter en français</button>
        </div>
        <input type="text" id="answerInput" placeholder="Mot dans ta langue" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="spacer"></div>
        <button class="check-btn" id="checkBtn" type="button">Vérifier</button>
      `;
      document.getElementById('listenBtn').addEventListener('click', () => speak(frWord, 'fr-FR'));
      speak(frWord, 'fr-FR');
    }

    const input = document.getElementById('answerInput');
    const checkBtn = document.getElementById('checkBtn');
    checkBtn.addEventListener('click', submitAnswer);
    input.addEventListener('keydown', e => { if(e.key === 'Enter' && !answered) submitAnswer(); });
    input.focus();
  }

  function submitAnswer(){
    if(answered) return;
    const input = document.getElementById('answerInput');
    const raw = input.value.trim();
    if(!raw){ input.focus(); return; }
    answered = true;
    input.disabled = true;
    document.getElementById('checkBtn').disabled = true;

    const match = bestMatch(raw, currentAccepted);
    const len = normalize(match.candidate).length;
    const threshold = len > 8 ? 2 : 1;

    const banner = document.getElementById('banner');
    const title = document.getElementById('bannerTitle');
    const detail = document.getElementById('bannerDetail');

    if(match.dist === 0){
      score++;
      banner.className = 'banner show correct';
      title.textContent = '✓ Correct !';
      detail.textContent = match.candidate;
    } else if(match.dist <= threshold){
      score++;
      banner.className = 'banner show correct';
      title.textContent = '✓ Presque !';
      detail.textContent = "Orthographe correcte : " + match.candidate;
    } else {
      banner.className = 'banner show wrong';
      title.textContent = "✕ Ce n'est pas ça";
      detail.textContent = "Réponse : " + match.candidate;
    }
    updateHeader();
  }

  document.getElementById('bannerContinue').addEventListener('click', function(){
    idx++;
    renderRound();
  });

  function renderRecap(){
    document.getElementById('barFill').style.width = '100%';
    const main = document.getElementById('quizMain');
    main.innerHTML = `
      <div class="recap">
        <p class="instr">Édition 2026 — résultat</p>
        <div class="big">${score}/${session.length}</div>
        <p>${score === session.length ? "Sans faute !" : "Continue, les mots reviendront."}</p>
        <div class="recap-btns">
          <button class="ghost-btn" id="againBtn" type="button">Recommencer</button>
          <button class="check-btn" id="doneBtn" type="button">Terminer</button>
        </div>
      </div>
    `;
    document.getElementById('againBtn').addEventListener('click', startSession);
    document.getElementById('doneBtn').addEventListener('click', endSession);
  }

})();
</script>
</body>
</html>
