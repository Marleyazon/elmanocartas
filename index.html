<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traducteur de poche</title>
<style>
  :root{
    --bg:#0f1620;
    --card:#ffffff;
    --ink:#26282b;
    --muted:#6b7280;
    --blue:#1f6fd6;
    --blue-dark:#1a5bb0;
    --purple:#7c3aed;
    --purple-dark:#6428c9;
    --green:#3fae4a;
    --green-dark:#2f8f39;
    --red:#e5533d;
    --red-dark:#c9432f;
    --gray:#e5e5e5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  .app{
    width:100%;
    max-width:440px;
    background:var(--card);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    min-height:560px;
    display:flex;
    flex-direction:column;
  }
  #screenHome{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    gap:20px;
    text-align:center;
  }
  .card-icon{
    width:150px; height:150px;
    border-radius:20px;
    background:var(--blue);
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 0 var(--blue-dark);
    transition:transform .05s;
  }
  .card-icon:active{ transform:translateY(6px); box-shadow:0 4px 0 var(--blue-dark); }
  .card-icon svg{ width:76px; height:76px; }
  h1{ font-size:22px; margin:6px 0 0; }
  .home-hint{ color:var(--muted); font-size:14px; margin:0; }
  .squares-row{ display:flex; gap:16px; margin-top:6px; }
  .square-btn{
    width:130px; height:130px;
    border-radius:20px;
    border:none;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .05s;
    color:#fff;
    font-family:inherit;
  }
  .square-btn:active{ transform:translateY(6px); }
  .square-btn.blue{ background:var(--blue); box-shadow:0 10px 0 var(--blue-dark); }
  .square-btn.blue:active{ box-shadow:0 4px 0 var(--blue-dark); }
  .square-btn.purple{ background:var(--purple); box-shadow:0 10px 0 var(--purple-dark); }
  .square-btn.purple:active{ box-shadow:0 4px 0 var(--purple-dark); }
  .square-btn svg{ width:44px; height:44px; }
  .square-btn span{ font-size:13px; font-weight:700; }
  .editions{ display:none; flex-direction:column; gap:12px; width:100%; margin-top:6px; }
  .editions.show{ display:flex; }
  .edition-btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:16px;
    font-size:17px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    color:#fff;
    background:var(--blue);
    box-shadow:0 6px 0 var(--blue-dark);
  }
  .edition-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--blue-dark); }
  .edition-btn.purple{ background:var(--purple); box-shadow:0 6px 0 var(--purple-dark); }
  .edition-btn.disabled{
    background:var(--gray);
    color:var(--muted);
    box-shadow:0 6px 0 #cfcfcf;
    cursor:not-allowed;
  }
  .edition-btn small{ display:block; font-weight:400; font-size:12px; margin-top:3px; opacity:.85; }
  #screenQuiz{ display:none; flex:1; flex-direction:column; }
  #screenQuiz.show{ display:flex; }
  .quiz-top{ display:flex; align-items:center; gap:12px; padding:16px 18px; }
  .close-btn{ background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; line-height:1; padding:4px; }
  .bar-track{ flex:1; height:12px; background:var(--gray); border-radius:8px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--green); width:0%; transition:width .3s ease; border-radius:8px; }
  .bar-fill.purple{ background:var(--purple); }
  .score-pill{ font-size:13px; font-weight:700; color:var(--blue); min-width:52px; text-align:right; }
  .quiz-main{ flex:1; padding:8px 24px 20px; display:flex; flex-direction:column; }
  .instr{ color:var(--muted); font-size:14px; text-align:center; margin:14px 0 4px; }
  .prompt-word{ font-size:32px; font-weight:800; text-align:center; margin:20px 0 26px; }
  #answerInput{
    width:100%;
    padding:15px 16px;
    border-radius:12px;
    border:2px solid var(--gray);
    font-size:17px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    text-align:center;
  }
  #answerInput:focus{ outline:none; border-color:var(--blue); }
  .spacer{ flex:1; }
  .check-btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:16px;
    font-size:16px;
    font-weight:800;
    font-family:inherit;
    color:#fff;
    background:var(--green);
    box-shadow:0 6px 0 var(--green-dark);
    cursor:pointer;
    margin-top:16px;
  }
  .check-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--green-dark); }
  .check-btn:disabled{ background:var(--gray); color:var(--muted); box-shadow:0 6px 0 #cfcfcf; cursor:not-allowed; }
  .banner{
    display:none;
    padding:18px 22px 22px;
    flex-direction:column;
    gap:10px;
  }
  .banner.show{ display:flex; }
  .banner.correct{ background:#d7f7db; }
  .banner.wrong{ background:#ffe1dc; }
  .banner-title{ font-weight:800; font-size:17px; display:flex; align-items:center; gap:8px; }
  .banner.correct .banner-title{ color:var(--green-dark); }
  .banner.wrong .banner-title{ color:var(--red-dark); }
  .banner-detail{ font-size:14px; color:var(--ink); }
  .banner-continue{
    border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:800;
    font-family:inherit; color:#fff; cursor:pointer;
  }
  .banner.correct .banner-continue{ background:var(--green); box-shadow:0 6px 0 var(--green-dark); }
  .banner.wrong .banner-continue{ background:var(--red); box-shadow:0 6px 0 var(--red-dark); }
  .banner-continue:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.3); }
  .recap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; gap:8px; }
  .recap .big{ font-size:46px; font-weight:800; color:var(--blue); margin:6px 0; }
  .recap-btns{ display:flex; gap:10px; width:100%; margin-top:18px; }
  .recap-btns button{ flex:1; }
  .ghost-btn{
    background:#fff; border:2px solid var(--blue); color:var(--blue);
    border-radius:14px; padding:14px; font-size:15px; font-weight:800; font-family:inherit; cursor:pointer;
  }

  /* mode phrases */
  .listen-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:6px auto 20px;
    background:var(--card);
    border:2px solid var(--purple);
    color:var(--purple);
    border-radius:14px;
    padding:12px 20px;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }
  .listen-btn:active{ background:#f2ecff; }
  .sentence{
    font-size:18px;
    line-height:2.4;
    text-align:left;
  }
  .blank-input{
    display:inline-block;
    width:auto;
    min-width:70px;
    max-width:220px;
    padding:4px 8px;
    margin:0 2px;
    border:none;
    border-bottom:2px solid var(--gray);
    font-family:inherit;
    font-size:17px;
    font-weight:700;
    text-align:center;
    color:var(--ink);
    background:#faf9f7;
    border-radius:4px 4px 0 0;
  }
  .blank-input:focus{ outline:none; border-bottom-color:var(--purple); }
  .blank-input.correct{ border-bottom-color:var(--green); background:#e9f9ea; color:var(--green-dark); }
  .blank-input.wrong{ border-bottom-color:var(--red); background:#fdeae7; color:var(--red-dark); }
  .check-btn.purple{ background:var(--purple); box-shadow:0 6px 0 var(--purple-dark); }
</style>
</head>
<body>

</div>

    { forms:[{c:"dormir"}], fr:["Dormir"] },

    { forms:[{c:"parlar"}], fr:["Parler"] },
    { forms:[{c:"regarβar"}], fr:["Regarder"] },

    { forms:[{c:"bon jue"}], fr:["Bonjour"] },

    { forms:[{c:"se íl te plaù"},{c:"íl te plaù"}], fr:["S'il te plaît"] },
    { forms:[{c:"o side"}], fr:["Au revoir"] },

    { forms:[{c:"coche"}], fr:["Voiture"] },

    { forms:[{c:"bato"}], fr:["Bateau"] }
  ];

  /* ---------------- Phrases (mode dictee audio) ---------------- */
  const PHRASES = [
    {
      text: "Mi dala es a la aeroporche en la carchaporche.",
      phonetic: "mi dale es al aeroportche en la carchaportche",
      blanks: ["dala", "aeroporche", "carchaporche"]
    },
    {
      text: "A uń veli para colar mi pajá dàns mi caìe.",
      phonetic: "aun vel par coler mi paja dàns mi caie",
      blanks: ["veli", "colar", "pajá", "caìe"]
    },
    {
      text: "La ajenda de mi amì es remplaçado todo.",
      phonetic: "larenda de mi ami es remplassad tode",
      blanks: ["ajenda", "amì", "remplaçado todo"]
    },
    {
      text: "No prendo la avìon pùrqùe, a era uń accidante para uña cìnema.",
      phonetic: "no prende lavion porque, aer un acssidante para uña cinema",
      blanks: ["prendo", "avìon pùrqùe", "era", "para", "cìnema"]
    },
    {
      text: "Mi mare manja del pan dàns la cùsìna.",
      phonetic: "mi mare manja del pan dans la cùsina",
      blanks: ["mare", "pan", "cùsìna"]
    },
    {
      text: "Mi pare bée de la eaù e regarβa par las vitras.",
      phonetic: "mi pare bèe de leau e regardza paras vitras",
      blanks: ["pare bée", "eaù", "regarβa", "las vitras"]
    },
    {
      text: "La cato noìre dorme en la lì.",
      phonetic: "la catoire dormen lali",
      blanks: ["cato noìre dorme", "lì"]
    },
    {
      text: "Me adono mi sìstra e mi frero.",
      phonetic: "madono mi sistre mi frere",
      blanks: ["adono", "sìstra", ["frero","bro"]]
    }
  ];

  /* ---------------- Texte / correction ---------------- */
  function normalize(s){
    return s.toString()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase()
      .replace(/[’']/g,"'")
      .replace(/[^a-z0-9' ]/g,'')
      .replace(/\s+/g,' ')
      .trim();
  }
  function levenshtein(a,b){
    const m=a.length,n=b.length;
    const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
    for(let i=0;i<=m;i++) d[i][0]=i;
    for(let j=0;j<=n;j++) d[0][j]=j;
    for(let i=1;i<=m;i++){
      for(let j=1;j<=n;j++){
        const cost = a[i-1]===b[j-1] ? 0 : 1;
        d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
      }
    }
    return d[m][n];
  }
  function bestMatch(userRaw, candidatesRaw){
    const user = normalize(userRaw);
    let best = { dist: Infinity, candidate: candidatesRaw[0] };
    for(const cand of candidatesRaw){
      const dist = levenshtein(user, normalize(cand));
      if(dist < best.dist) best = { dist, candidate: cand };
    }
    return best;
  }
  function isCloseEnough(userRaw, answer){
    const dist = levenshtein(normalize(userRaw), normalize(answer));
    const len = normalize(answer).length;
    const threshold = len > 8 ? 2 : 1;
    return dist <= threshold;
  }
  function bestAcceptedMatch(userRaw, acceptedList){
    const user = normalize(userRaw);
    let best = { dist: Infinity, candidate: acceptedList[0] };
    for(const cand of acceptedList){
      const dist = levenshtein(user, normalize(cand));
      if(dist < best.dist) best = { dist, candidate: cand };
    }
    return best;
  }

  /* ---------------- Voix (mode phrases uniquement) ---------------- */
  function pickVoice(lang){
    const voices = window.speechSynthesis.getVoices();
    const prefix = lang.slice(0,2).toLowerCase();
    const matchLocal = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix) && v.localService);
    if(matchLocal) return matchLocal;
    const matchAny = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
    if(matchAny) return matchAny;
    return null;
  }
  let currentUtterance = null;
  function speak(text, lang){
    if(!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      setTimeout(function(){
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        const v = pickVoice(lang);
        if(v) u.voice = v;
        u.rate = 0.8;
        currentUtterance = u;
        window.speechSynthesis.speak(u);
      }, 80);
    }catch(e){}
  }
  if('speechSynthesis' in window){
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
  }

  /* ---------------- Ecrans ---------------- */
  const screenHome = document.getElementById('screenHome');
  const screenQuiz = document.getElementById('screenQuiz');
  const cardBtn = document.getElementById('cardBtn');
  const editions = document.getElementById('editions');
  const homeHint = document.getElementById('homeHint');
  const btn2025 = document.getElementById('btn2025');
  const btn2026 = document.getElementById('btn2026');
  const btnPhrases = document.getElementById('btnPhrases');
  const closeBtn = document.getElementById('closeBtn');

  cardBtn.addEventListener('click', function(){
    editions.classList.toggle('show');
    homeHint.style.display = editions.classList.contains('show') ? 'none' : '';
  });
  btn2025.addEventListener('click', function(){ });
  btn2026.addEventListener('click', startWordSession);
  btnPhrases.addEventListener('click', startPhraseSession);
  closeBtn.addEventListener('click', endSession);

  let mode = 'words'; // 'words' | 'phrases'

  function endSession(){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    screenQuiz.classList.remove('show');
    screenHome.style.display = '';
    editions.classList.remove('show');
    homeHint.style.display = '';
    document.getElementById('barFill').className = 'bar-fill';
  }

  /* ================= MODE MOTS ================= */
  let wSession = [];
  let wIdx = 0;
  let wScore = 0;
  let wAccepted = [];
  let wAnswered = false;

  function shuffledWordSession(){
    const pool = VOCAB.slice();
    for(let i=pool.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]]=[pool[j],pool[i]];
    }
    const picked = pool.slice(0, Math.min(20, pool.length));
    return picked.map(entry => ({
      entry,
      dir: Math.random() < 0.5 ? 'c2f' : 'f2c'
    }));
  }

  function startWordSession(){
    mode = 'words';
    wSession = shuffledWordSession();
    wIdx = 0;
    wScore = 0;
    screenHome.style.display = 'none';
    screenQuiz.classList.add('show');
    document.getElementById('barFill').className = 'bar-fill';
    document.getElementById('banner').classList.remove('show','correct','wrong');
    renderWordRound();
  }

  function updateWordHeader(){
    document.getElementById('scorePill').textContent = wScore + '/' + wSession.length;
    document.getElementById('barFill').style.width = (wIdx/wSession.length*100) + '%';
  }

  function renderWordRound(){
    wAnswered = false;
    const banner = document.getElementById('banner');
    banner.classList.remove('show','correct','wrong');

    if(wIdx >= wSession.length){
      renderWordRecap();
      return;
    }
    updateWordHeader();
    const round = wSession[wIdx];
    const main = document.getElementById('quizMain');

    if(round.dir === 'c2f'){
      const form = round.entry.forms[Math.floor(Math.random()*round.entry.forms.length)];
      wAccepted = round.entry.fr;
      main.innerHTML = `
        <p class="instr">Écris la traduction en français</p>
        <p class="prompt-word">${form.c}</p>
        <input type="text" id="answerInput" placeholder="______" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="spacer"></div>
        <button class="check-btn" id="checkBtn" type="button">Valider</button>
      `;
    } else {
      const frWord = round.entry.fr[Math.floor(Math.random()*round.entry.fr.length)];
      wAccepted = round.entry.forms.map(f => f.c);
      main.innerHTML = `
        <p class="instr">Écris ce mot dans ta langue</p>
        <p class="prompt-word">${frWord}</p>
        <input type="text" id="answerInput" placeholder="______" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="spacer"></div>
        <button class="check-btn" id="checkBtn" type="button">Valider</button>
      `;
    }

    const input = document.getElementById('answerInput');
    const checkBtn = document.getElementById('checkBtn');
    checkBtn.addEventListener('click', submitWordAnswer);
    input.addEventListener('keydown', e => { if(e.key === 'Enter' && !wAnswered) submitWordAnswer(); });
    input.focus();
  }

  function submitWordAnswer(){
    if(wAnswered) return;
    const input = document.getElementById('answerInput');
    const raw = input.value.trim();
    if(!raw){ input.focus(); return; }
    wAnswered = true;
    input.disabled = true;
    document.getElementById('checkBtn').disabled = true;

    const match = bestMatch(raw, wAccepted);
    const len = normalize(match.candidate).length;
    const threshold = len > 8 ? 2 : 1;

    const banner = document.getElementById('banner');
    const title = document.getElementById('bannerTitle');
    const detail = document.getElementById('bannerDetail');

    if(match.dist === 0){
      wScore++;
      banner.className = 'banner show correct';
      title.textContent = '✓ Correct !';
      detail.textContent = match.candidate;
    } else if(match.dist <= threshold){
      wScore++;
      banner.className = 'banner show correct';
      title.textContent = '✓ Presque !';
      detail.textContent = "Orthographe correcte : " + match.candidate;
    } else {
      banner.className = 'banner show wrong';
      title.textContent = "✕ Ce n'est pas ça";
      detail.textContent = "Réponse : " + match.candidate;
    }
    updateWordHeader();
  }

  function renderWordRecap(){
    document.getElementById('barFill').style.width = '100%';
    const main = document.getElementById('quizMain');
    main.innerHTML = `
      <div class="recap">
        <p class="instr">Édition 2026 — résultat</p>
        <div class="big">${wScore}/${wSession.length}</div>
        <p>${wScore === wSession.length ? "Sans faute !" : "Continue, les mots reviendront."}</p>
        <div class="recap-btns">
          <button class="ghost-btn" id="againBtn" type="button">Recommencer</button>
          <button class="check-btn" id="doneBtn" type="button">Terminer</button>
        </div>
      </div>
    `;
    document.getElementById('againBtn').addEventListener('click', startWordSession);
    document.getElementById('doneBtn').addEventListener('click', endSession);
  }

  /* ================= MODE PHRASES ================= */
  let pSession = [];
  let pIdx = 0;
  let pScore = 0;
  let pAnswered = false;
  let pCurrentBlanks = [];

  function shuffledPhraseSession(){
    const arr = PHRASES.slice();
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function startPhraseSession(){
    mode = 'phrases';
    pSession = shuffledPhraseSession();
    pIdx = 0;
    pScore = 0;
    screenHome.style.display = 'none';
    screenQuiz.classList.add('show');
    document.getElementById('barFill').className = 'bar-fill purple';
    document.getElementById('banner').classList.remove('show','correct','wrong');
    renderPhraseRound();
  }

  function updatePhraseHeader(){
    document.getElementById('scorePill').textContent = pScore + '/' + pSession.length;
    document.getElementById('barFill').style.width = (pIdx/pSession.length*100) + '%';
  }

  function buildSegments(text, blanks){
    const segments = [];
    let cursor = 0;
    blanks.forEach((blank, i) => {
      const matchText = Array.isArray(blank) ? blank[0] : blank;
      const idx = text.indexOf(matchText, cursor);
      if(idx === -1) return;
      if(idx > cursor){
        segments.push({ type:'text', value: text.slice(cursor, idx) });
      }
      segments.push({ type:'blank', index:i, answer: matchText });
      cursor = idx + matchText.length;
    });
    if(cursor < text.length){
      segments.push({ type:'text', value: text.slice(cursor) });
    }
    return segments;
  }
  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderPhraseRound(){
    pAnswered = false;
    const banner = document.getElementById('banner');
    banner.classList.remove('show','correct','wrong');

    if(pIdx >= pSession.length){
      renderPhraseRecap();
      return;
    }
    updatePhraseHeader();
    const phrase = pSession[pIdx];
    pCurrentBlanks = phrase.blanks;
    const segments = buildSegments(phrase.text, phrase.blanks);

    let html = '<p class="instr">Écoute la phrase et complète les mots manquants</p>';
    html += '<div class="listen-btn-row" style="display:flex;justify-content:center;">';
    html += '<button class="listen-btn" id="listenBtn" type="button">🔊 Écouter la phrase</button>';
    html += '</div>';
    html += '<p class="sentence">';
    segments.forEach(seg => {
      if(seg.type === 'text'){
        html += escapeHtml(seg.value);
      } else {
        const widthCh = Math.max(4, seg.answer.length + 1);
        html += `<input type="text" class="blank-input" data-index="${seg.index}" style="width:${widthCh}ch" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">`;
      }
    });
    html += '</p>';
    html += '<div class="spacer"></div>';
    html += '<button class="check-btn purple" id="checkBtn" type="button">Valider</button>';

    const main = document.getElementById('quizMain');
    main.innerHTML = html;

    document.getElementById('listenBtn').addEventListener('click', () => speak(phrase.phonetic, 'es-ES'));
    speak(phrase.phonetic, 'es-ES');

    document.getElementById('checkBtn').addEventListener('click', submitPhraseAnswer);
    const blankInputs = main.querySelectorAll('.blank-input');
    blankInputs.forEach((inp, i) => {
      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter' && !pAnswered) submitPhraseAnswer();
      });
    });
    if(blankInputs.length) blankInputs[0].focus();
  }

  function submitPhraseAnswer(){
    if(pAnswered) return;
    const main = document.getElementById('quizMain');
    const blankInputs = main.querySelectorAll('.blank-input');
    let filled = true;
    blankInputs.forEach(inp => { if(!inp.value.trim()) filled = false; });
    if(!filled){ return; }

    pAnswered = true;
    document.getElementById('checkBtn').disabled = true;

    let allCorrect = true;
    let wrongList = [];
    blankInputs.forEach(inp => {
      const idx = parseInt(inp.getAttribute('data-index'), 10);
      const answer = pCurrentBlanks[idx];
      const acceptedList = Array.isArray(answer) ? answer : [answer];
      inp.disabled = true;
      const match = bestAcceptedMatch(inp.value, acceptedList);
      if(isCloseEnough(inp.value, match.candidate)){
        inp.classList.add('correct');
      } else {
        inp.classList.add('wrong');
        allCorrect = false;
        wrongList.push(acceptedList.join(' / '));
      }
    });

    const banner = document.getElementById('banner');
    const title = document.getElementById('bannerTitle');
    const detail = document.getElementById('bannerDetail');

    if(allCorrect){
      pScore++;
      banner.className = 'banner show correct';
      title.textContent = '✓ Correct !';
      detail.textContent = 'Phrase complète.';
    } else {
      banner.className = 'banner show wrong';
      title.textContent = "✕ Il y a des erreurs";
      detail.textContent = "Réponse(s) correcte(s) : " + wrongList.join(' / ');
    }
    updatePhraseHeader();
  }

  function renderPhraseRecap(){
    document.getElementById('barFill').style.width = '100%';
    const main = document.getElementById('quizMain');
    main.innerHTML = `
      <div class="recap">
        <p class="instr">Phrases audio — résultat</p>
        <div class="big">${pScore}/${pSession.length}</div>
        <p>${pScore === pSession.length ? "Sans faute !" : "Continue, les phrases reviendront."}</p>
        <div class="recap-btns">
          <button class="ghost-btn" id="againBtn" type="button">Recommencer</button>
          <button class="check-btn purple" id="doneBtn" type="button">Terminer</button>
        </div>
      </div>
    `;
    document.getElementById('againBtn').addEventListener('click', startPhraseSession);
    document.getElementById('doneBtn').addEventListener('click', endSession);
  }

  /* bannerContinue commun aux deux modes */
  document.getElementById('bannerContinue').addEventListener('click', function(){
    if(mode === 'words'){
      wIdx++;
      renderWordRound();
    } else {
      pIdx++;
      renderPhraseRound();
    }
  });

})();
</script>
</body>
</html>
